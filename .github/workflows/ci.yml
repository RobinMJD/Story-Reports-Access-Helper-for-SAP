name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency tree
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Verify source and tests
        run: npm run verify

      - name: Build the Microsoft Edge Add-ons package
        run: npm run package:edge

      - name: Verify package contents and checksum
        run: npm run verify:edge-package

      - name: Resolve exact package path
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "zip=release/story-reports-access-helper-for-sap-v${VERSION}-microsoft-edge-addons.zip" >> "$GITHUB_OUTPUT"

      - name: Upload CI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: microsoft-edge-addons-package
          path: |
            ${{ steps.package.outputs.zip }}
            release/SHA256SUMS.txt
          if-no-files-found: error
