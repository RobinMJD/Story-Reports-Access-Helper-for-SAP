<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Reports Access Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon48.png" width="48" height="48" alt="">
        <div>
          <h1>Story Reports Access Helper</h1>
          <p class="subtitle">for SAP SuccessFactors</p>
        </div>
      </header>

      <section
        id="status-card"
        class="status-card"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="true"
      >
        <span id="status-dot" class="status-dot checking" aria-hidden="true"></span>
        <div>
          <strong id="status-title">Checking this report…</strong>
          <p id="status-detail">This status updates automatically.</p>
        </div>
      </section>

      <section class="actions" aria-label="Report help">
        <div id="fix-action" hidden>
          <button
            id="fix-report"
            class="primary-action"
            type="button"
            aria-describedby="fix-guidance"
            aria-busy="false"
            disabled
          >Fix this report</button>
          <p id="fix-guidance" class="action-guidance">Use this if the Story Report stays blank.</p>
        </div>

        <button id="sap-help" class="secondary-action" type="button">Open SAP help article</button>
      </section>

      <footer>
        <span>Automatic help · No report data sent</span>
        <span id="version"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
